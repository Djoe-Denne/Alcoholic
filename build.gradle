tasks.register('checkArchitecture') {
    group = 'verification'
    description = 'Fails when a module imports a forbidden platform API.'

    doLast {
        forbiddenImports.each { moduleName, prefixes ->
            fileTree("${rootDir}/${moduleName}/src") {
                include '**/*.java'
            }.each { source ->
                source.eachLine { line, number ->
                    def normalized = line.trim()
                    prefixes.each { prefix ->
                        if (normalized.startsWith("import ${prefix}") ||
                                normalized.startsWith("import static ${prefix}")) {
                            throw new GradleException(
                                    "Forbidden dependency '${prefix}' in ${source}:${number}"
                            )
                        }
                    }
                }
            }
        }
    }
}

def genericEngineSourceRoots = [
        'alcoholic-api/src/main/java',
        'domain/src/main/java/com/djden/alcoholic/domain/beverage',
        'domain/src/main/java/com/djden/alcoholic/domain/process',
        'domain/src/main/java/com/djden/alcoholic/domain/liquid',
        'domain/src/main/java/com/djden/alcoholic/domain/property',
        'domain/src/main/java/com/djden/alcoholic/domain/vessel',
        'application/src/main/java/com/djden/alcoholic/application/beverage',
        'application/src/main/java/com/djden/alcoholic/application/process',
        'application/src/main/java/com/djden/alcoholic/application/property',
        'minecraft-common/src/main/java/com/djden/alcoholic/minecraft/beverage',
        'minecraft-common/src/main/java/com/djden/alcoholic/minecraft/environment',
