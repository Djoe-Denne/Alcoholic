        'domain/src/main/java/com/djden/alcoholic/domain/multiblock',
        'application/src/main/java/com/djden/alcoholic/application/machine',
        'minecraft-common/src/main/java/com/djden/alcoholic/minecraft/multiblock',
        'minecraft-common/src/main/java/com/djden/alcoholic/minecraft/machine'
]

def forbiddenBeverageTokens = ~/\b(Wine|Beer|Whisky|Whiskey|Rum|wine|beer|whisky|whiskey|rum)\b/

tasks.register('checkBeverageFrameworkPurity') {
    group = 'verification'
    description = 'Fails when generic beverage-framework sources name a finite drink family.'

    doLast {
        genericEngineSourceRoots.each { relativeRoot ->
            def root = file("${rootDir}/${relativeRoot}")
            if (!root.exists()) {
                return
            }
            fileTree(root) {
                include '**/*.java'
                exclude '**/builtin/**'
                exclude '**/content/**'
            }.each { source ->
                source.eachLine { line, number ->
                    if (forbiddenBeverageTokens.matcher(line).find()) {
                        throw new GradleException(
                                "Forbidden beverage identity in generic engine source ${source}:${number}"
                        )
                    }
                }
            }
        }
    }
}

gradle.projectsEvaluated {
    tasks.named('assemble') {
        dependsOn subprojects.collect { it.tasks.named('assemble') }
    }

    tasks.named('check') {
        dependsOn tasks.named('checkArchitecture')
        dependsOn tasks.named('checkBeverageFrameworkPurity')
        dependsOn subprojects.collect { it.tasks.named('check') }
    }

    tasks.register('test') {
        group = 'verification'
        description = 'Runs all unit tests.'
        dependsOn subprojects.findAll { it.tasks.names.contains('test') }
                .collect { it.tasks.named('test') }
    }

    tasks.register('runData') {
        group = 'forgegradle runs'
        description = 'Generates common and Forge resources.'
        dependsOn ':platform-forge-1.19.2:runDataCommon'
    }

    tasks.register('runClient') {
        group = 'forgegradle runs'
        dependsOn ':platform-forge-1.19.2:runClient'
    }

    tasks.register('runGameTestServer') {
        group = 'verification'
        dependsOn ':platform-forge-1.19.2:runGameTestServer'
    }
}
